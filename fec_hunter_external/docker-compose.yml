# One always-on collector. Restart policies and the health check below are what keep it
# running unattended: Docker restarts the container if it exits, and the health check
# restarts it if the scan loop stops making progress.
services:
  hunter:
    build: .
    container_name: fec-hunter
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - hunter-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  hunter-data: